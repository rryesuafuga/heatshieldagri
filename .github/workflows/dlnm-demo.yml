# Re-runs the DLNM demonstration whenever its folder changes.
# GitHub Actions only discovers workflows in the repository root .github/workflows/,
# so this file must stay here — not inside the project folder it builds.
name: dlnm-demo

on:
  push:
    paths:
      - "dlnm/temperature-mortality-dlnm/**"
      - ".github/workflows/dlnm-demo.yml"
  pull_request:
    paths:
      - "dlnm/temperature-mortality-dlnm/**"
      - ".github/workflows/dlnm-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dlnm/temperature-mortality-dlnm
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      # If a lockfile has been committed (see R/make_renv_lock.R), restore the
      # exact pinned versions. Otherwise install the current releases.
      - name: Check for a lockfile
        id: lock
        run: |
          if [ -f renv.lock ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore pinned package versions (renv.lock)
        if: steps.lock.outputs.found == 'true'
        run: Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv"); renv::restore(prompt = FALSE)'

      - name: Install R packages (no lockfile - current releases)
        if: steps.lock.outputs.found == 'false'
        run: Rscript -e 'install.packages(c("dlnm", "gnm", "tsModel", "rmarkdown"))'

      - name: Run the full pipeline
        run: Rscript run_all.R

      - name: Check the attributable-fraction code against the reference function
        run: Rscript R/99_validate_attributable.R

      # Tier 2 ships no real data, so the synthetic generator is the only thing
      # keeping that code honest. Run it (base R only, no extra packages).
      - name: Generate the Tier-2 synthetic DHS stand-in
        run: Rscript data-raw/make_synthetic_dhs.R

      # Builds every plain-English sentence from the saved outputs without
      # starting Shiny, so the app's logic is verified even though the UI is not.
      - name: Check the plain-English results app
        run: Rscript app/app.R --check

      # ---- Shinylive: the app compiled to WebAssembly as a static site ----
      # Runs entirely in the visitor's browser, so any static host (GitHub
      # Pages, Vercel, Netlify) can serve it. The bundle is a snapshot of the
      # outputs produced by this run.
      - name: Bundle the app with its outputs
        run: |
          mkdir -p app/outputs app/www
          cp -r outputs/tables app/outputs/
          cp outputs/fit_timeseries.rds outputs/dat.rds app/outputs/
          cp -r outputs/figures app/www/figs

      - name: Export the app with Shinylive
        run: |
          Rscript -e 'install.packages("shinylive")'
          Rscript -e 'shinylive::export("app", "site")'
          du -sh site

      - name: Upload the static site
        uses: actions/upload-artifact@v4
        with:
          name: temperature-mortality-explained
          path: dlnm/temperature-mortality-dlnm/site

      - name: Upload the static site for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dlnm/temperature-mortality-dlnm/site

      - name: Upload report, figures and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlnm-demo-outputs
          path: |
            dlnm/temperature-mortality-dlnm/report/report.md
            dlnm/temperature-mortality-dlnm/outputs/figures
            dlnm/temperature-mortality-dlnm/outputs/tables

  # Publishes the Shinylive site to GitHub Pages on every push to main.
  # One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: reproduce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publishes the same static site to Vercel as the project
  # "temperature-mortality-explained", on every push to main. The workflow
  # links (and on first run creates) the project itself, so the only secret
  # needed is VERCEL_TOKEN. Skips itself, without failing, when it is absent.
  deploy-vercel:
    if: github.ref == 'refs/heads/main'
    needs: reproduce
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: raymond-reuel-wayesus-projects
      VERCEL_PROJECT: temperature-mortality-explained
    steps:
      - name: Download the static site
        if: env.VERCEL_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: temperature-mortality-explained
          path: site

      - name: Create (first run) and link the Vercel project
        if: env.VERCEL_TOKEN != ''
        working-directory: site
        run: |
          npm install -g vercel@latest
          # Diagnostics only. A team-scoped token has no user identity, so
          # 'whoami' reports "User not found" for it - that is expected.
          echo "::group::Token diagnostics (failures here are informational)"
          vercel whoami --token "$VERCEL_TOKEN" || echo "(no user identity: token is probably team-scoped, which is fine)"
          vercel teams ls --token "$VERCEL_TOKEN" || true
          echo "::endgroup::"
          # Create the project if it is not there yet; harmless once it exists.
          vercel project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            || echo "Project already exists (or could not be created - see the deploy step)."
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: site
        run: vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: VERCEL_TOKEN not set - skipped
        if: env.VERCEL_TOKEN == ''
        run: echo "Add VERCEL_TOKEN as a repository secret to enable this step."
