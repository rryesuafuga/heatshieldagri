# Re-runs the DLNM demonstration whenever its folder changes.
# Lives at the repository root: .github/workflows/dlnm-demo.yml
name: dlnm-demo

on:
  push:
    paths:
      - "research/temperature-mortality-dlnm/**"
      - ".github/workflows/dlnm-demo.yml"
  pull_request:
    paths:
      - "research/temperature-mortality-dlnm/**"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/temperature-mortality-dlnm
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R packages (binaries from Posit Package Manager)
        run: Rscript -e 'install.packages(c("dlnm", "gnm", "tsModel", "rmarkdown"))'

      - name: Run the full pipeline
        run: Rscript run_all.R

      - name: Check the attributable-fraction code against the reference function
        run: Rscript R/99_validate_attributable.R

      - name: Upload report, figures and tables
        uses: actions/upload-artifact@v4
        with:
          name: dlnm-demo-outputs
          path: |
            research/temperature-mortality-dlnm/report/report.md
            research/temperature-mortality-dlnm/outputs/figures
            research/temperature-mortality-dlnm/outputs/tables
